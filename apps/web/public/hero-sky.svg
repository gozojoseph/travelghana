<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#184a9e"/>
      <stop offset="0.42" stop-color="#3a7fd4"/>
      <stop offset="0.78" stop-color="#8fc0ee"/>
      <stop offset="1" stop-color="#d9edfb"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.14" r="0.55">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#fff6d8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cumulus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#e2f0fc" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="blur-lg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="blur-md" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blur-sm" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- high, thin wisps -->
  <g fill="#ffffff" opacity="0.32" filter="url(#blur-md)">
    <ellipse cx="520" cy="250" rx="300" ry="40"/>
    <ellipse cx="1250" cy="180" rx="260" ry="34"/>
    <ellipse cx="900" cy="120" rx="320" ry="36"/>
    <ellipse cx="300" cy="400" rx="260" ry="18"/>
    <ellipse cx="1150" cy="300" rx="300" ry="20"/>
  </g>

  <!-- broad cumulus bank, lower left -->
  <g fill="url(#cumulus)" filter="url(#blur-lg)">
    <ellipse cx="200" cy="700" rx="320" ry="140"/>
    <ellipse cx="430" cy="650" rx="240" ry="120"/>
    <ellipse cx="60" cy="620" rx="200" ry="100"/>
  </g>

  <!-- main cumulus, mid right -->
  <g fill="url(#cumulus)" filter="url(#blur-lg)">
    <ellipse cx="1330" cy="520" rx="280" ry="120"/>
    <ellipse cx="1120" cy="560" rx="200" ry="95"/>
    <ellipse cx="1500" cy="560" rx="180" ry="90"/>
  </g>
  <g fill="#ffffff" opacity="0.85" filter="url(#blur-md)">
    <ellipse cx="1280" cy="470" rx="170" ry="70"/>
    <ellipse cx="1450" cy="500" rx="130" ry="60"/>
  </g>

  <!-- small bright puffs -->
  <g fill="#ffffff" opacity="0.8" filter="url(#blur-sm)">
    <ellipse cx="760" cy="330" rx="110" ry="40"/>
    <ellipse cx="880" cy="360" rx="80" ry="34"/>
    <ellipse cx="640" cy="300" rx="70" ry="30"/>
    <ellipse cx="1040" cy="640" rx="120" ry="42"/>
    <ellipse cx="1180" cy="670" rx="90" ry="36"/>
    <ellipse cx="960" cy="690" rx="80" ry="30"/>
  </g>
</svg>
